# Managed by dots2 (stow package: alacritty).
# Colors are generated from theme/palette.sh into colors.toml (imported below).

[general]
import = [
  "~/.config/alacritty/colors.toml",
]

# MonoLisaCode Nerd Font — MonoLisa patched with Nerd Font glyphs (installed by
# scripts/30-fonts.sh); size left at alacritty's default. Self-contained, so no
# fallback font is needed.
[font.normal]
family = "MonoLisaCode Nerd Font"
style = "Regular"

[font.bold]
family = "MonoLisaCode Nerd Font"
style = "Bold"

[font.italic]
family = "MonoLisaCode Nerd Font"
style = "Italic"

[font.bold_italic]
family = "MonoLisaCode Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
