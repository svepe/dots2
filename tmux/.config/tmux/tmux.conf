# Managed by dots2 (stow package: tmux). Colors/status: theme.conf (generated
# from theme/palette.sh by tmux/generate-theme.sh).

set-option -g prefix C-a
set -g mode-keys vi
set -g mouse on

# vi-style copy-mode selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi m send-keys -X set-mark
bind-key -T copy-mode-vi ` send-keys -X jump-to-mark

# generated theme + status bar
source-file ~/.config/tmux/theme.conf

# --- plugins (managed by tpm) -----------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: manual save/restore (prefix + Ctrl-s / Ctrl-r), incl. pane contents.
# continuum keeps periodic auto-saves, but do NOT auto-restore on start.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'

# Initialize tpm (keep at the very bottom).
run '~/.config/tmux/plugins/tpm/tpm'
