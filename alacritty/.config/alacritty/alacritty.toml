# Managed by dots2 (stow package: alacritty).
# Colors are generated from theme/palette.sh into colors.toml (imported below).

[general]
import = [
  "~/.config/alacritty/colors.toml",
  "~/.config/alacritty/font.toml",
]

# The font family lives in font.toml, generated by scripts/30-fonts.sh: the
# patched MonoLisaCode Nerd Font when the private font is installed, else the
# bundled Hack Nerd Font. Bold/italic derive from the normal family; size is
# left at alacritty's default.

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
