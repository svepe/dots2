# --- base styles ------------------------------------------------------------
set -g mode-style "fg=#f8f8f8,bg=#3a3a3a"
set -g message-style "fg=#1c1c1c,bg=#e0af68"
set -g message-command-style "fg=#1c1c1c,bg=#e0af68"
set -g copy-mode-match-style "fg=#1c1c1c,bg=#cccccc"
set -g copy-mode-current-match-style "fg=#1c1c1c,bg=#e0af68"
set -g copy-mode-mark-style "fg=#f8f8f8,bg=#ff007c"
set -g pane-border-style "fg=#4e4e4e"
set -g pane-active-border-style "fg=#9ece6a"

# --- status bar -------------------------------------------------------------
set -g status on
set -g status-interval 2
set -g status-justify left
set -g status-style "fg=#9ece6a,bg=#1c1c1c"
set -g status-left-length 60
set -g status-right-length 90

# left: session (blue) tapering via a blue arrow onto the black window area
set -g status-left "#[fg=#000000,bg=#7aa2f7] #S #[fg=#7aa2f7,bg=#1c1c1c]#[fg=#9ece6a,bg=#1c1c1c]"

# windows: current = green pill with a black-on-green leading cap and a
# green-on-black trailing cap; inactive = green text on black, soft index│name divider.
set -g window-status-separator ""
set -g window-status-format "#[fg=#9ece6a,bg=#1c1c1c] #I#{?window_flags,#F, }#[fg=#4e4e4e]#[fg=#9ece6a] #W "
set -g window-status-current-format "#[fg=#1c1c1c,bg=#9ece6a]#[fg=#000000,bg=#9ece6a] #I#F #[fg=#000000]#[fg=#000000] #W #[fg=#9ece6a,bg=#1c1c1c]#[fg=#9ece6a,bg=#1c1c1c]"

# right: cpu/mem (grey) · disk / (green) · host (blue), hard separators
set -g status-right "#[fg=#4e4e4e,bg=#1c1c1c]#[fg=#9ece6a,bg=#4e4e4e] #($HOME/.config/tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load --interval 2 --averages-count 0 --graph-lines 0) #[fg=#9ece6a,bg=#4e4e4e]#[fg=#000000,bg=#9ece6a] #(df -h / | awk 'NR==2{print $5}') #[fg=#7aa2f7,bg=#9ece6a]#[fg=#000000,bg=#7aa2f7] #h #[default]"
