# keyd — low-level key remapping (runs before the compositor).
# Installed to /etc/keyd/default.conf by scripts/70-keyd.sh; reload: sudo keyd reload
#
# [ids] * matches all keyboards. overload(layer, key): held = layer, tapped = key.

[ids]
*

[main]
# Caps Lock: tap = Escape, hold = Control (dual-role, home-row friendly).
capslock = overload(control, esc)

# Grave/backtick: tap = `, hold = "nav" layer for window focus.
grave = overload(nav, grave)

[nav]
# Hold ` and use hjkl -> emit the Meta+Alt+HJKL combos that the spatial-focus
# KWin script listens for (directional window focus, home-row ergonomic).
h = M-A-h
j = M-A-j
k = M-A-k
l = M-A-l
# Hold ` and press 1..9 -> Alt+1..9 = jump to the N-th window (same as Alt+N).
1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9
