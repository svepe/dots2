<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Generic font families for confined snaps (mirrors the KDE host)</description>

  <!-- Must stay a real file: conf.d symlinks into /usr/share/fontconfig dangle
       inside snaps, so the generic-family configs never load there. -->

  <!-- Replaces 49-sansserif.conf: if a pattern names no generic, append
       sans-serif. Must come first (upstream runs it at 49, before 60-latin) so
       the generic aliases below still expand it — this is what catches
       uninstalled sans families like Verdana and Tahoma. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append_last">
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- Legacy names Qt/Xlib still request. Must precede the generic aliases
       below so the generic they map to still gets expanded. -->
  <alias>
    <family>Helvetica</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>Arial</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>Sans Serif</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>Times</family>
    <prefer><family>serif</family></prefer>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer><family>serif</family></prefer>
  </alias>
  <alias>
    <family>Courier</family>
    <prefer><family>monospace</family></prefer>
  </alias>
  <alias>
    <family>Courier New</family>
    <prefer><family>monospace</family></prefer>
  </alias>

  <!-- Fallback chains. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>MonoLisaCode Nerd Font</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- prepend_first to beat 58-dejavu-lgc-*, which survives confinement and
       prefers DejaVu LGC for monospace. A missing family is skipped, so an
       absent MonoLisa just falls through to the chain above. -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first">
      <string>MonoLisaCode Nerd Font</string>
    </edit>
  </match>
  <!-- Only monospace needs this. sans-serif/serif already resolve via the
       chains above, and a second prepend_first would stomp this one: a Courier
       pattern carries both monospace and an appended sans-serif, so whichever
       rule ran last would take the head. -->

</fontconfig>
