<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Nerd Font glyphs as a universal fallback. Coding fonts without icons
       (e.g. MonoLisaCode) then render Nerd Font symbols in any app that uses
       fontconfig fallback (alacritty, etc.) — so tmux/nvim/starship glyphs work
       without changing the primary font. Weak binding: only used for codepoints
       the primary font lacks (the Nerd Font PUA ranges), so normal text is
       unaffected. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
